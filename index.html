    <title>Bill Split Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
    
    <style>
        :root {
            /* Light Theme */
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-primary: #4f46e5;
            --accent-secondary: #7c3aed;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            --glass-blur: blur(20px);
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --badge-bg: #e0e7ff;
            --badge-text: #4338ca;
            --row-hover: rgba(79, 70, 229, 0.04);
            --matrix-cell-hover: #f8fafc;
            --matrix-input-hover: #f1f5f9;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 60%, #1e1b4b 100%);
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-hover: #4f46e5;
            --danger: #f87171;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            --glass-blur: blur(20px);
            --input-bg: rgba(15, 23, 42, 0.8);
            --input-border: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(99, 102, 241, 0.2);
            --badge-text: #c7d2fe;
            --row-hover: rgba(99, 102, 241, 0.08);
            --matrix-cell-hover: rgba(255, 255, 255, 0.02);
            --matrix-input-hover: rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-touch-callout: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        #app {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: var(--text-primary);
            padding-top: 20px;
            position: relative;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 span {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text-primary);
            font-size: 1.25rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .theme-toggle-btn:hover {
            transform: rotate(15deg) scale(1.1);
            border-color: var(--accent-primary);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--input-border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
            -webkit-user-select: none;
            user-select: none;
        }

        .tab-button.active {
            color: var(--accent-primary);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 2px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            color: var(--text-primary);
            transition: border-color 0.3s, box-shadow 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input[readonly] {
            background: var(--matrix-cell-hover);
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.8;
            border-color: var(--input-border);
        }

        input[type="file"] {
            padding: 8px 16px;
            cursor: pointer;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Poppins', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button-secondary {
            background: transparent;
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
            box-shadow: none;
        }

        .button-secondary:active {
            background: var(--row-hover);
        }

        .button-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px;
            font-size: 0.9rem;
            box-shadow: none;
        }

        .button-danger:active {
            background: var(--danger);
            color: white;
        }

        .button-small {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .item-card {
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .item-price {
            background: var(--accent-primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .portions-grid {
            display: grid;
            gap: 12px;
        }

        .portion-input {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
        }

        .portion-input label {
            margin: 0;
            min-width: 100px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .portion-input input {
            flex: 1;
            margin: 0;
        }

        .portion-display {
            min-width: 60px;
            text-align: right;
            font-weight: 600;
            color: var(--accent-primary);
            font-size: 0.95rem;
        }

        .toggle-group {
            display: inline-flex;
            background: var(--input-border);
            border-radius: 8px;
            padding: 4px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-weight: 650;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .toggle-btn.active {
            background: var(--card-bg);
            color: var(--accent-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .person-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            margin-bottom: 8px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .summary-item {
            background: var(--input-bg);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-primary);
            border-top: 1px solid var(--input-border);
            border-right: 1px solid var(--input-border);
            border-bottom: 1px solid var(--input-border);
        }

        .summary-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .breakdown-table th {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            padding: 16px;
            text-align: left;
            font-weight: 600;
        }

        .breakdown-table td {
            padding: 16px;
            border-bottom: 1px solid var(--input-border);
            color: var(--text-primary);
        }

        .breakdown-table tbody tr:active {
            background: var(--row-hover);
        }

        .person-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .amount {
            font-weight: 700;
            color: var(--accent-primary);
            font-size: 1.1rem;
        }

        .share-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            color: var(--text-secondary);
            -webkit-user-select: none;
            user-select: none;
        }

        .share-btn:active {
            border-color: var(--accent-primary);
            background: var(--row-hover);
        }

        .share-btn.primary {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .share-btn.primary:active {
            background: var(--accent-hover);
        }

        .ocr-preview {
            background: var(--input-bg);
            border: 2px dashed var(--accent-primary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .ocr-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .ocr-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid var(--input-border);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .extracted-items {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .extracted-item {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--input-border);
        }

        .extracted-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .extracted-item input {
            flex: 1;
        }

        .extracted-item-price {
            min-width: 100px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-secondary);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1000;
            animation: slideInToast 0.3s ease-out;
            font-weight: 600;
        }

        @keyframes slideInToast {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Spreadsheet Matrix Layout */
        .matrix-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            background: var(--input-bg);
            margin-top: 16px;
            box-shadow: var(--shadow);
            -webkit-overflow-scrolling: touch;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 650px;
        }

        .matrix-table th {
            background: var(--matrix-cell-hover);
            color: var(--accent-primary);
            font-weight: 600;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid var(--input-border);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .matrix-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--input-border);
            vertical-align: middle;
        }

        .matrix-table tbody tr {
            transition: background-color 0.2s;
        }

        .matrix-table tbody tr:hover {
            background-color: var(--matrix-cell-hover);
        }

        .matrix-input-name {
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid transparent;
            background: transparent;
            padding: 6px 8px;
            width: 100%;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .matrix-input-name:hover {
            border-color: var(--input-border);
            background: var(--matrix-input-hover);
        }

        .matrix-input-name:focus {
            background: var(--input-bg);
            border-color: var(--accent-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .matrix-input-price {
            font-weight: 700;
            color: var(--accent-primary);
            border: 1px solid transparent;
            background: transparent;
            padding: 6px 8px;
            width: 90px;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .matrix-input-price:hover {
            border-color: var(--input-border);
            background: var(--matrix-input-hover);
        }

        .matrix-input-price:focus {
            background: var(--input-bg);
            border-color: var(--accent-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .matrix-portion-input {
            width: 70px;
            padding: 6px 8px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s;
            background: var(--input-bg);
        }

        .matrix-portion-input:focus {
            outline: none;
            background: var(--input-bg);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .matrix-total-cell {
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .matrix-delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .matrix-delete-btn:hover {
            background: var(--danger-bg);
            transform: scale(1.05);
        }

        .matrix-action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
        }

        .matrix-action-btn:hover {
            background: var(--badge-bg);
            transform: scale(1.05);
        }

        .matrix-action-btn.clear {
            color: var(--text-muted);
        }

        .matrix-action-btn.clear:hover {
            background: var(--row-hover);
        }

        /* Individual Breakdown Cards */
        .breakdown-card {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .breakdown-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow);
        }

        .breakdown-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .breakdown-card-name {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .breakdown-card-total {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--accent-primary);
            font-size: 1.2rem;
        }

        .breakdown-card-body {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .breakdown-item-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .tax-tip-line {
            color: var(--text-muted);
            font-style: italic;
            border-top: 1px dashed var(--input-border);
            padding-top: 6px;
            margin-top: 6px;
        }

        .share-btn-compact {
            width: 100%;
            background: var(--input-bg);
            color: var(--accent-primary);
            border: 1.5px solid var(--accent-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Outfit', sans-serif;
        }

        .share-btn-compact:hover {
            background: var(--row-hover);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }

        .share-btn-compact:active {
            transform: scale(0.98);
        }

        #individualBreakdowns {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 600px) {
            #individualBreakdowns, #historyIndividualBreakdowns {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;

            .input-row {
                grid-template-columns: 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .portion-input {
                flex-wrap: wrap;
            }

            .share-buttons {
                grid-template-columns: 1fr;
            }

            .breakdown-table th,
            .breakdown-table td {
                padding: 12px 8px;
                font-size: 0.9rem;
            }

            .card {
                padding: 20px;
            }
        }

        /* History Styles */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        .history-item:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .history-item-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 0;
            margin-right: 16px;
        }
        .history-item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .history-item-meta {
            display: flex;
            gap: 8px;
        }
